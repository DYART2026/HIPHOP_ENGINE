<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYART - Gerador de Áudios (hip.hop)</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
      color: #333; 
    }
    .card { 
      background: #fff; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      max-width: 800px; 
      margin: 0 auto 20px auto; 
    }
    h1 { 
      margin-top: 0; 
      color: #1a73e8; 
      font-size: 22px; 
    }
    p {
      color: #555;
      font-size: 14px;
    }
    label { 
      font-weight: bold; 
      display: block; 
      margin-top: 14px; 
      margin-bottom: 4px; 
    }
    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box; 
    }
    .btn { 
      background: #1a73e8; 
      color: #fff; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 15px; 
      font-weight: bold; 
      margin-top: 20px; 
    }
    .btn:hover { 
      background: #1557b0; 
    }
    .btn:disabled { 
      background: #ccc; 
      cursor: not-allowed; 
    }
    #log { 
      background: #1e1e1e; 
      color: #00ff66; 
      padding: 15px; 
      border-radius: 6px; 
      font-family: monospace; 
      height: 280px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      font-size: 13px; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DYART Business Intelligence — Motor de Áudios (hip.hop)</h1>
    <p>Geração automatizada de narrações via ElevenLabs para a pasta <code>IMPL_output_audios</code>.</p>
    
    <label for="apiKey">Chave da API ElevenLabs:</label>
    <input type="password" id="apiKey" placeholder="Cole sua chave xi-api-key aqui (sk_...)">

    <label for="voiceId">Voice ID (Voz Padrão - Roberta):</label>
    <input type="text" id="voiceId" value="RGymW84CSmfVugnA5tvA" placeholder="ID da Voz">

    <button class="btn" id="btnIniciar" onclick="processarPlanilha()">Iniciar Geração de Áudios</button>
  </div>

  <div class="card">
    <h3>Log de Processamento e Controle de Qualidade</h3>
    <div id="log">Aguardando comando de início...</div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÕES GERAIS DYART (PLUG & PLAY)
    // ============================================================
    // Se quiser fixar sua chave permanente no código, cole entre as aspas:
    const CONFIG_API_KEY_DEFAULT = "sk_2be8e538eb422605abd0ea3092449529a2614c2a416d06d4"; 
    // Voice ID da Roberta (Nativa PT-BR)
    const CONFIG_VOICE_ID_DEFAULT = "RGymW84CSmfVugnA5tvA";

    const SPREADSHEET_ID = '1jJICHQs7sWhx82q6D3fZyCUcht5j9JINJRaHpbyV0Yk';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    // Carrega valores padrão na interface assim que abre a página
    window.onload = () => {
      if (CONFIG_API_KEY_DEFAULT) {
        document.getElementById('apiKey').value = CONFIG_API_KEY_DEFAULT;
      }
      if (CONFIG_VOICE_ID_DEFAULT) {
        document.getElementById('voiceId').value = CONFIG_VOICE_ID_DEFAULT;
      }
    };

    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      logDiv.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function processarPlanilha() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const voiceId = document.getElementById('voiceId').value.trim();
      const btn = document.getElementById('btnIniciar');

      if (!apiKey) {
        alert('Por favor, informe a Chave da API ElevenLabs!');
        return;
      }

      if (!voiceId) {
        alert('Por favor, informe o Voice ID!');
        return;
      }

      btn.disabled = true;
      logMessage('Lendo planilha do município...');

      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        
        // Trata a resposta da API do Google GViz
        const jsonData = JSON.parse(text.substring(47, text.length - 2));
        const rows = jsonData.table.rows;

        logMessage(`Encontrados ${rows.length} registros na planilha.`);

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i].c;
          if (!row) continue;

          // Mapeamento mantendo a Coluna A (auditoria) desconsiderada:
          const nomePatrimonio = row[1] ? row[1].v : `Ponto ${i+1}`; // Coluna B (NOME DO PATRIMÔNIO)
          const textoAudio     = row[4] ? row[4].v : null;           // Coluna E (TEXTO)
          const prefixoAudio   = row[13] ? row[13].v : null;         // Coluna N (Prefixo)

          if (!prefixoAudio) {
            logMessage(`⚠️ Linha ${i+1} (${nomePatrimonio}): Coluna N (Prefixo) vazia. Pulando...`);
            continue;
          }

          if (!textoAudio) {
            logMessage(`⚠️ Linha ${i+1} (${nomePatrimonio}): Coluna E (Texto) sem conteúdo. Pulando...`);
            continue;
          }

          logMessage(`\n--- Processando: ${nomePatrimonio} [${prefixoAudio}] ---`);

          // Nome do arquivo pronto para a pasta IMPL_output_audios
          const nomeArquivoPT = `PT_${prefixoAudio}.mp3`;
          await gerarAudioElevenLabs(textoAudio, nomeArquivoPT, voiceId, apiKey);
        }

        logMessage('\n Processamento concluído com sucesso!');
        logMessage(`Mova os arquivos baixados para a pasta IMPL_output_audios no Google Drive.`);

      } catch (error) {
        logMessage(`❌ Erro ao ler planilha: ${error.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function gerarAudioElevenLabs(texto, nomeArquivo, voiceId, apiKey) {
      logMessage(`🎙️ Sintetizando narração: ${nomeArquivo}...`);
      
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': apiKey
          },
          body: JSON.stringify({
            text: texto,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - ${response.statusText}`);
        }

        const blob = await response.blob();
        
        // Dispara o download automático com a nomenclatura perfeita
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        logMessage(` Gravado com sucesso: ${nomeArquivo}`);

      } catch (err) {
        logMessage(`❌ Erro ElevenLabs (${nomeArquivo}): ${err.message}`);
      }
    }
  </script>
</body>
</html>
