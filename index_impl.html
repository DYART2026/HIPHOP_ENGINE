<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Áudio - Project hip.hop (DYART)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a365d;
            margin-top: 0;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2c5282;
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        #logConsole {
            background-color: #1a202c;
            color: #68d391;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-error { color: #fc8181; }
        .log-info { color: #63b3ed; }
        .log-success { color: #68d391; }
        .log-warn { color: #f6ad55; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ Gerador de Áudios - hip.hop</h1>
    <p style="color: #718096; font-size: 14px;">Automação de síntese vocal via ElevenLabs + Google Sheets (ABA2)</p>

    <div class="form-group">
        <label for="apiKey">Chave de API (ElevenLabs):</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key da ElevenLabs aqui (xi-api-key)">
    </div>

    <button id="btnIniciar" onclick="iniciarProcessamento()">Iniciar Geração de Áudios</button>

    <h3>Log de Processamento:</h3>
    <div id="logConsole">Aguardando comando de início...</div>
</div>

<script>
// --- CONFIGURAÇÕES DE RECURSOS DA PLANILHA ---
const SPREADSHEET_ID = '1jJICHQs7sWhx82q6D3fZyCUcht5j9JINJRaHpbyV0Yk';
const SHEET_NAME = 'ABA2';

// --- VOZES PADRÃO (Fallback caso não haja ID específica na linha) ---
const DEFAULT_VOICE_PT = '21m00Tcm4TlvDq8ikWAM'; // Rachel / Padrão
const DEFAULT_VOICE_EN = '21m00Tcm4TlvDq8ikWAM'; 
const DEFAULT_VOICE_ES = '21m00Tcm4TlvDq8ikWAM'; 

// Modelo de síntese multilíngue v2 da ElevenLabs
const MODEL_ID = 'eleven_multilingual_v2';

// --- FUNÇÃO DE LOG ---
function log(mensagem, tipo = 'normal') {
    const consoleElem = document.getElementById('logConsole');
    const timestamp = new Date().toLocaleTimeString();
    let classe = '';
    
    if (tipo === 'erro') classe = 'log-error';
    if (tipo === 'info') classe = 'log-info';
    if (tipo === 'sucesso') classe = 'log-success';
    if (tipo === 'alerta') classe = 'log-warn';

    consoleElem.innerHTML += `<span class="${classe}">[${timestamp}] ${mensagem}</span>\n`;
    consoleElem.scrollTop = consoleElem.scrollHeight;
}

// --- EXTRAÇÃO SEGURA DE TEXTO DAS CÉLULAS GVIZ ---
function extrairTexto(celula) {
    if (!celula) return '';
    let val = celula.f !== undefined && celula.f !== null ? celula.f : celula.v;
    if (val === null || val === undefined) return '';
    return String(val).trim();
}

// --- LEITURA DA PLANILHA VIA GOOGLE VIZ API ---
async function carregarDadosABA2() {
    log('Lendo dados da ABA2 no Google Sheets...', 'info');
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const response = await fetch(url);
    if (!response.ok) throw new Error(`Falha na conexão HTTP (${response.status})`);
    
    const textData = await response.text();
    // Remove o envelope JSONP do GViz: /*O_o*/ google.visualization.Query.setResponse(...);
    const jsonString = textData.substring(textData.indexOf('{'), textData.lastIndexOf('}') + 1);
    const data = JSON.parse(jsonString);

    const rows = data.table.rows;
    const filaDeAudios = [];

    rows.forEach((row) => {
        // Coluna A: Nome do Patrimônio
        const patrimonio = extrairTexto(row.c[0]);

        // Pula linha de cabeçalho ou se o nome do patrimônio estiver vazio
        if (!patrimonio || patrimonio.toUpperCase().includes("NOME DO PATRIMÔNIO")) {
            return;
        }

        // --- PORTUGUÊS (Colunas E, F, O) ---
        const textoPT = extrairTexto(row.c[4]);
        let arqPT     = extrairTexto(row.c[5]);
        const voicePT = extrairTexto(row.c[14]) || DEFAULT_VOICE_PT;

        if (textoPT !== '' && arqPT !== '') {
            if (!arqPT.toLowerCase().endsWith('.mp3')) arqPT += '.mp3';
            filaDeAudios.push({ patrimonio, idioma: 'PT', texto: textoPT, arquivo: arqPT, voiceId: voicePT });
        }

        // --- INGLÊS (Colunas J, K, P) ---
        const textoEN = extrairTexto(row.c[9]);
        let arqEN     = extrairTexto(row.c[10]);
        const voiceEN = extrairTexto(row.c[15]) || DEFAULT_VOICE_EN;

        if (textoEN !== '' && arqEN !== '') {
            if (!arqEN.toLowerCase().endsWith('.mp3')) arqEN += '.mp3';
            filaDeAudios.push({ patrimonio, idioma: 'EN', texto: textoEN, arquivo: arqEN, voiceId: voiceEN });
        }

        // --- ESPANHOL (Colunas L, M, Q) ---
        const textoES = extrairTexto(row.c[11]);
        let arqES     = extrairTexto(row.c[12]);
        const voiceES = extrairTexto(row.c[16]) || DEFAULT_VOICE_ES;

        if (textoES !== '' && arqES !== '') {
            if (!arqES.toLowerCase().endsWith('.mp3')) arqES += '.mp3';
            filaDeAudios.push({ patrimonio, idioma: 'ES', texto: textoES, arquivo: arqES, voiceId: voiceES });
        }
    });

    return filaDeAudios;
}

// --- SÍNTESE DE VOZ VIA ELEVENLABS ---
async function gerarAudioElevenLabs(apiKey, item) {
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${item.voiceId}`;

    const payload = {
        text: item.texto,
        model_id: MODEL_ID,
        voice_settings: {
            stability: 0.5,
            similarity_boost: 0.75
        }
    };

    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': apiKey,
            'Content-Type': 'json' ? 'application/json' : 'application/json'
        },
        body: JSON.stringify(payload)
    });

    if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.detail?.message || `Erro ElevenLabs HTTP ${response.status}`);
    }

    return await response.blob();
}

// --- DISPARO DE DOWNLOAD LOCAL DO ARQUIVO .MP3 ---
function baixarArquivo(blob, nomeArquivo) {
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
}

// --- FLUXO PRINCIPAL DE PROCESSAMENTO ---
async function iniciarProcessamento() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const btn = document.getElementById('btnIniciar');

    if (!apiKey) {
        alert('Por favor, informe a sua API Key da ElevenLabs.');
        return;
    }

    document.getElementById('logConsole').innerHTML = '';
    btn.disabled = true;

    try {
        const fila = await carregarDadosABA2();
        log(`Linhas lidas com sucesso. Total de ${fila.length} áudio(s) para gerar.`, 'sucesso');

        if (fila.length === 0) {
            log('Nenhum áudio pendente encontrado (verifique se as células de texto/arquivo estão preenchidas).', 'alerta');
            btn.disabled = false;
            return;
        }

        let patrimônioAtual = '';

        for (let i = 0; i < fila.length; i++) {
            const item = fila[i];

            if (item.patrimonio !== patrimônioAtual) {
                patrimônioAtual = item.patrimonio;
                log(`\n==================================================`, 'info');
                log(`📍 Patrimônio: ${patrimônioAtual}`, 'info');
                log(`==================================================`, 'info');
            }

            log(`⏳ [${i + 1}/${fila.length}] Gerando áudio ${item.idioma}: "${item.arquivo}"...`, 'normal');

            try {
                const blobAudio = await gerarAudioElevenLabs(apiKey, item);
                baixarArquivo(blobAudio, item.arquivo);
                log(`✅ Concluído e baixado: ${item.arquivo}`, 'sucesso');
            } catch (errAudio) {
                log(`❌ Falha ao gerar ${item.arquivo}: ${errAudio.message}`, 'erro');
            }

            // Pausa de 1 segundo entre requisições para evitar rate limit
            await new Promise(r => setTimeout(r, 1000));
        }

        log(`\n🎉 Processamento finalizado com sucesso!`, 'sucesso');

    } catch (err) {
        log(`❌ Erro ao processar a ABA2: ${err.message}`, 'erro');
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
