<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYART - Gerador de Áudios (hip.hop)</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
      color: #333; 
    }
    .card { 
      background: #fff; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      max-width: 800px; 
      margin: 0 auto 20px auto; 
    }
    h1 { 
      margin-top: 0; 
      color: #1a73e8; 
      font-size: 22px; 
    }
    p {
      color: #555;
      font-size: 14px;
    }
    label { 
      font-weight: bold; 
      display: block; 
      margin-top: 14px; 
      margin-bottom: 4px; 
    }
    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box; 
    }
    .btn { 
      background: #1a73e8; 
      color: #fff; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 15px; 
      font-weight: bold; 
      margin-top: 20px; 
    }
    .btn:hover { 
      background: #1557b0; 
    }
    .btn:disabled { 
      background: #ccc; 
      cursor: not-allowed; 
    }
    #log { 
      background: #1e1e1e; 
      color: #00ff66; 
      padding: 15px; 
      border-radius: 6px; 
      font-family: monospace; 
      height: 300px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      font-size: 13px; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DYART Business Intelligence — Motor de Áudios (hip.hop)</h1>
    <p>Geração automatizada de narrações multilíngues via ElevenLabs para a pasta <code>IMPL_output_audios</code>.</p>
    
    <label for="apiKey">Chave da API ElevenLabs:</label>
    <input type="password" id="apiKey" placeholder="Cole sua nova chave xi-api-key aqui (sk_...)">

    <label for="voiceId">Voice ID Padrão (Fallback - Roberta PT-BR):</label>
    <input type="text" id="voiceId" value="RGymW84CSmfVugnA5tvA" placeholder="ID da Voz">

    <button class="btn" id="btnIniciar" onclick="processarPlanilha()">Iniciar Geração de Áudios</button>
  </div>

  <div class="card">
    <h3>Log de Processamento e Controle de Qualidade</h3>
    <div id="log">Aguardando comando de início...</div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÕES GERAIS DYART (PLUG & PLAY)
    // ============================================================
    const CONFIG_API_KEY_DEFAULT = "sk_29ed24bb2146ebd2d02ea331b52e1949b962aa022db108c1"; // Cole sua nova chave de teste se desejar
    const CONFIG_VOICE_ID_DEFAULT = "RGymW84CSmfVugnA5tvA"; // Roberta (PT-BR)

    const SPREADSHEET_ID = '1jJICHQs7sWhx82q6D3fZyCUcht5j9JINJRaHpbyV0Yk';
    const NOME_DA_ABA = 'ABA2';

    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(NOME_DA_ABA)}`;

    window.onload = () => {
      if (CONFIG_API_KEY_DEFAULT) {
        document.getElementById('apiKey').value = CONFIG_API_KEY_DEFAULT;
      }
      if (CONFIG_VOICE_ID_DEFAULT) {
        document.getElementById('voiceId').value = CONFIG_VOICE_ID_DEFAULT;
      }
    };

    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      logDiv.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function processarPlanilha() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const voiceIdFallback = document.getElementById('voiceId').value.trim();
      const btn = document.getElementById('btnIniciar');

      if (!apiKey) {
        alert('Por favor, informe a Chave da API ElevenLabs!');
        return;
      }

      btn.disabled = true;
      logMessage(`Lendo dados da ${NOME_DA_ABA}...`);

      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        
        // Converte o payload JSON da API do Google GViz
        const jsonData = JSON.parse(text.substring(47, text.length - 2));
        const rows = jsonData.table.rows;

        logMessage(`Encontrados ${rows.length} registros na ${NOME_DA_ABA}.`);

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i].c;
          if (!row) continue;

          const nomePatrimonio = row[0] ? row[0].v : `Ponto ${i+1}`;
          
          // Busca Voice ID dinâmico da Coluna N (índice 13) ou usa a voz padrão da tela
          const voiceIdLinha = (row[13] && row[13].v) ? row[13].v.trim() : voiceIdFallback;

          // Mapeamento dos 3 Idiomas baseado nas colunas da ABA2:
          // Col C (2) = RESUMO PT | Col D (3) = ÁUDIO_PT
          // Col H (7) = RESUMO EN | Col I (8) = ÁUDIO_EN
          // Col J (9) = RESUMO ES | Col K (10) = ÁUDIO_ES
          const idiomas = [
            { lang: 'PT', texto: row[2]?.v,  arquivo: row[3]?.v },
            { lang: 'EN', texto: row[7]?.v,  arquivo: row[8]?.v },
            { lang: 'ES', texto: row[9]?.v,  arquivo: row[10]?.v }
          ];

          logMessage(`\n==================================================`);
          logMessage(`📍 Patrimônio: ${nomePatrimonio}`);
          logMessage(`==================================================`);

          for (const item of idiomas) {
            if (!item.texto || !item.arquivo) {
              logMessage(`⚠️ [${item.lang}] Texto ou Nome do Arquivo não encontrado. Pulando...`);
              continue;
            }

            if (!voiceIdLinha) {
              logMessage(`❌ [${item.lang}] Nenhum Voice ID informado para a síntese.`);
              continue;
            }

            // Garante a extensão .mp3 caso a fórmula CONCATENAR entregue apenas o prefixo
            const nomeFinal = item.arquivo.endsWith('.mp3') ? item.arquivo : `${item.arquivo}.mp3`;

            logMessage(`🎙️ Sintetizando [${item.lang}]: ${nomeFinal}...`);
            await gerarAudioElevenLabs(item.texto, nomeFinal, voiceIdLinha, apiKey);
          }
        }

        logMessage('\n Processamento multilíngue concluído!');
        logMessage(`Mova os arquivos baixados para a pasta IMPL_output_audios no Google Drive.`);

      } catch (error) {
        logMessage(`❌ Erro ao processar a ${NOME_DA_ABA}: ${error.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function gerarAudioElevenLabs(texto, nomeArquivo, voiceId, apiKey) {
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': apiKey
          },
          body: JSON.stringify({
            text: texto,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - ${response.statusText}`);
        }

        const blob = await response.blob();
        
        // Aciona o download direto para a máquina local
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        logMessage(` Gravado com sucesso: ${nomeArquivo}`);

      } catch (err) {
        logMessage(`❌ Erro ElevenLabs (${nomeArquivo}): ${err.message}`);
      }
    }
  </script>
</body>
</html>
