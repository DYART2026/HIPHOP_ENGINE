<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYART Business Intelligence — Motor de Áudios (hip.hop)</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
      color: #333; 
    }
    .card { 
      background: #fff; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      max-width: 800px; 
      margin: 0 auto 20px auto; 
    }
    h1 { 
      margin-top: 0; 
      color: #1a73e8; 
      font-size: 22px; 
    }
    p {
      color: #555;
      font-size: 14px;
    }
    .btn { 
      background: #1a73e8; 
      color: #fff; 
      border: none; 
      padding: 12px 24px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    .btn:hover { 
      background: #1557b0; 
    }
    .btn:disabled { 
      background: #ccc; 
      cursor: not-allowed; 
    }
    #log { 
      background: #1e1e1e; 
      color: #00ff66; 
      padding: 15px; 
      border-radius: 6px; 
      font-family: monospace; 
      height: 350px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      font-size: 13px; 
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DYART Business Intelligence — Motor de Áudios (hip.hop)</h1>
    <p>Geração automatizada de narrações multilíngues via ElevenLabs a partir dos dados da <strong>ABA2</strong>.</p>

    <button class="btn" id="btnIniciar" onclick="processarPlanilha()">Iniciar Geração de Áudios</button>
  </div>

  <div class="card">
    <h3>Log de Processamento e Controle de Qualidade</h3>
    <div id="log">Aguardando comando de início...</div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÕES INTERNAS DYART
    // ============================================================
    // Cole a sua chave de API abaixo entre as aspas:
    const API_KEY_ELEVENLABS = "sk_29ed24bb2146ebd2d02ea331b52e1949b962aa022db108c1"; 

    const SPREADSHEET_ID = '1jJICHQs7sWhx82q6D3fZyCUcht5j9JINJRaHpbyV0Yk';
    const NOME_DA_ABA = 'ABA2';

    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(NOME_DA_ABA)}`;

    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      logDiv.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Extração segura de texto para evitar erros de conversão ou datas do GViz
    function extrairTexto(celula) {
      if (!celula) return '';
      let val = celula.f !== undefined && celula.f !== null ? celula.f : celula.v;
      if (val === null || val === undefined) return '';
      return String(val).trim();
    }

    async function processarPlanilha() {
      const btn = document.getElementById('btnIniciar');

      if (!API_KEY_ELEVENLABS || API_KEY_ELEVENLABS === "COLE_SUA_CHAVE_AQUI") {
        alert('Por favor, defina a chave da ElevenLabs na variável API_KEY_ELEVENLABS dentro do código.');
        return;
      }

      btn.disabled = true;
      document.getElementById('log').textContent = `[${new Date().toLocaleTimeString()}] Lendo dados da ${NOME_DA_ABA}...`;

      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        
        // Trata o retorno da API de visualização do Google
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const jsonData = JSON.parse(jsonString);
        const rows = jsonData.table.rows;

        logMessage(`Encontrados ${rows.length} registros na ${NOME_DA_ABA}.`);

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i].c;
          if (!row) continue;

          // Coluna A (0) = NOME DO PATRIMÔNIO
          const nomePatrimonio = extrairTexto(row[0]);
          
          // Ignora cabeçalho ou linhas em branco
          if (!nomePatrimonio || nomePatrimonio.toUpperCase().includes("NOME DO PATRIMÔNIO")) {
            continue;
          }

          // Busca as IDs das vozes diretamente das 3 ÚLTIMAS COLUNAS da planilha (O, P, Q):
          // Col O (14) = ID VOICE_PT | Col P (15) = ID VOICE_EN | Col Q (16) = ID VOICE_ES
          const voicePT = extrairTexto(row[14]);
          const voiceEN = extrairTexto(row[15]);
          const voiceES = extrairTexto(row[16]);

          // Mapeamento dos Textos e Nomes dos Arquivos:
          // Col E (4) = RESUMO PT | Col F (5)  = ÁUDIO_PT
          // Col J (9) = RESUMO EN | Col K (10) = ÁUDIO_EN
          // Col L (11) = RESUMO ES | Col M (12) = ÁUDIO_ES
          const idiomas = [
            { lang: 'PT', texto: extrairTexto(row[4]),  arquivo: extrairTexto(row[5]),  voiceId: voicePT },
            { lang: 'EN', texto: extrairTexto(row[9]),  arquivo: extrairTexto(row[10]), voiceId: voiceEN },
            { lang: 'ES', texto: extrairTexto(row[11]), arquivo: extrairTexto(row[12]), voiceId: voiceES }
          ];

          logMessage(`\n==================================================`);
          logMessage(`📍 Patrimônio: ${nomePatrimonio}`);
          logMessage(`==================================================`);

          for (const item of idiomas) {
            // Se o texto ou o nome do arquivo estiverem vazios na planilha, pula o idioma
            if (!item.texto || !item.arquivo) {
              logMessage(`⚠️ [${item.lang}] Sem texto ou nome de arquivo. Pulando...`);
              continue;
            }

            // Se a célula do ID da Voz estiver vazia na planilha, avisa no log
            if (!item.voiceId) {
              logMessage(`❌ [${item.lang}] ID da voz não foi preenchido na coluna da planilha. Pulando...`);
              continue;
            }

            // Garante a extensão .mp3 sem quebrar o código
            let nomeFinal = item.arquivo;
            if (!nomeFinal.toLowerCase().endsWith('.mp3')) {
              nomeFinal += '.mp3';
            }

            logMessage(`🎙️ Sintetizando [${item.lang}]: ${nomeFinal}...`);
            await gerarAudioElevenLabs(item.texto, nomeFinal, item.voiceId, API_KEY_ELEVENLABS);
            
            // Pausa de 1 segundo entre chamadas de API
            await new Promise(r => setTimeout(r, 1000));
          }
        }

        logMessage('\n🎉 Processamento multilíngue concluído!');
        logMessage(`Mova os arquivos baixados para a pasta IMPL_output_audios no Google Drive.`);

      } catch (error) {
        logMessage(`❌ Erro ao processar a ${NOME_DA_ABA}: ${error.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function gerarAudioElevenLabs(texto, nomeArquivo, voiceId, apiKey) {
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': apiKey
          },
          body: JSON.stringify({
            text: texto,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75
            }
          })
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.detail?.message || `HTTP ${response.status} - ${response.statusText}`);
        }

        const blob = await response.blob();
        
        // Aciona o download automático do áudio .mp3
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);
        
        logMessage(`✅ Gravado com sucesso: ${nomeArquivo}`);

      } catch (err) {
        logMessage(`❌ Erro ElevenLabs (${nomeArquivo}): ${err.message}`);
      }
    }
  </script>
</body>
</html>
