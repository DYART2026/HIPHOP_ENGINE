<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYART Business Intelligence — Motor de Áudios (hip.hop)</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
      color: #333; 
    }
    .card { 
      background: #fff; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      max-width: 800px; 
      margin: 0 auto 20px auto; 
    }
    h1 { 
      margin-top: 0; 
      color: #1a73e8; 
      font-size: 22px; 
    }
    p {
      color: #555;
      font-size: 14px;
    }
    .btn { 
      background: #1a73e8; 
      color: #fff; 
      border: none; 
      padding: 12px 24px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    .btn:hover { 
      background: #1557b0; 
    }
    .btn:disabled { 
      background: #ccc; 
      cursor: not-allowed; 
    }
    #log { 
      background: #1e1e1e; 
      color: #00ff66; 
      padding: 15px; 
      border-radius: 6px; 
      font-family: monospace; 
      height: 350px; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      font-size: 13px; 
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DYART Business Intelligence — Motor de Áudios (hip.hop)</h1>
    <p>Geração automatizada de narrações multilíngues via ElevenLabs a partir dos dados da <strong>ABA2</strong>.</p>

    <button class="btn" id="btnIniciar" onclick="processarPlanilha()">Iniciar Geração de Áudios</button>
  </div>

  <div class="card">
    <h3>Log de Processamento e Controle de Qualidade</h3>
    <div id="log">Aguardando comando de início...</div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAÇÕES INTERNAS DYART
    // ============================================================
    const API_KEY_ELEVENLABS = "sk_29ed24bb2146ebd2d02ea331b52e1949b962aa022db108c1"; 
    
    // Voice ID da Roberta (usado se a coluna da planilha estiver em branco)
    const VOICE_ROBERTA_DEFAULT = "RGymW84CSmfVugnA5tvA";

    const SPREADSHEET_ID = '1jJICHQs7sWhx82q6D3fZyCUcht5j9JINJRaHpbyV0Yk';
    const NOME_DA_ABA = 'ABA2';

    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(NOME_DA_ABA)}`;

    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      logDiv.textContent += `\n${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Função de extração por índice de coluna (0 = Coluna A, 1 = Coluna B, etc.)
    function lerColuna(celulasLinha, indiceColuna) {
      if (!celulasLinha || !celulasLinha[indiceColuna]) return '';
      const celula = celulasLinha[indiceColuna];
      let val = celula.f !== undefined && celula.f !== null ? celula.f : celula.v;
      if (val === null || val === undefined) return '';
      return String(val).trim();
    }

    async function processarPlanilha() {
      const btn = document.getElementById('btnIniciar');

      if (!API_KEY_ELEVENLABS || API_KEY_ELEVENLABS === "COLE_SUA_CHAVE_AQUI") {
        alert('Por favor, insira a chave da ElevenLabs na variável API_KEY_ELEVENLABS no código.');
        return;
      }

      btn.disabled = true;
      document.getElementById('log').textContent = `Conectando ao Google Sheets (${NOME_DA_ABA})...`;

      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const jsonData = JSON.parse(jsonString);
        const linhas = jsonData.table.rows;

        logMessage(`Registros encontrados na ${NOME_DA_ABA}: ${linhas.length}`);

        for (let i = 0; i < linhas.length; i++) {
          const colunas = linhas[i].c;
          if (!colunas) continue;

          // Coluna A (índice 0) = NOME DO PATRIMÔNIO
          const nomePatrimonio = lerColuna(colunas, 0);
          
          // Ignora a linha de cabeçalho ou patrimônios vazios
          if (!nomePatrimonio || nomePatrimonio.toUpperCase().includes("NOME DO PATRIMÔNIO")) {
            continue;
          }

          // Leituras das IDs de voz: Coluna O (índice 14), Coluna P (índice 15), Coluna Q (índice 16)
          const voicePT = lerColuna(colunas, 14) || VOICE_ROBERTA_DEFAULT;
          const voiceEN = lerColuna(colunas, 15) || VOICE_ROBERTA_DEFAULT;
          const voiceES = lerColuna(colunas, 16) || VOICE_ROBERTA_DEFAULT;

          // Mapeamento dos idiomas:
          // PT: Texto na Coluna E (4), Arquivo na Coluna F (5)
          // EN: Texto na Coluna J (9), Arquivo na Coluna K (10)
          // ES: Texto na Coluna L (11), Arquivo na Coluna M (12)
          const idiomas = [
            { lang: 'PT', texto: lerColuna(colunas, 4),  arquivo: lerColuna(colunas, 5),  voiceId: voicePT },
            { lang: 'EN', texto: lerColuna(colunas, 9),  arquivo: lerColuna(colunas, 10), voiceId: voiceEN },
            { lang: 'ES', texto: lerColuna(colunas, 11), arquivo: lerColuna(colunas, 12), voiceId: voiceES }
          ];

          logMessage(`\n==================================================`);
          logMessage(`📍 Patrimônio: ${nomePatrimonio}`);
          logMessage(`==================================================`);

          for (const item of idiomas) {
            // Pula o idioma apenas se o texto ou o nome do arquivo estiverem em branco na planilha
            if (!item.texto || !item.arquivo) {
              logMessage(`⚠️ [${item.lang}] Sem texto ou nome de arquivo preenchido. Pulando...`);
              continue;
            }

            let nomeFinal = item.arquivo;
            if (!nomeFinal.toLowerCase().endsWith('.mp3')) {
              nomeFinal += '.mp3';
            }

            logMessage(`🎙️ Sintetizando [${item.lang}]: ${nomeFinal}... (Voz: ${item.voiceId})`);
            await gerarAudioElevenLabs(item.texto, nomeFinal, item.voiceId, API_KEY_ELEVENLABS);
            
            // Pausa de 1 segundo entre chamadas
            await new Promise(r => setTimeout(r, 1000));
          }
        }

        logMessage('\n🎉 Processamento concluído com sucesso!');
        logMessage(`Mova os arquivos baixados para a pasta IMPL_output_audios no Google Drive.`);

      } catch (error) {
        logMessage(`❌ Erro durante o processamento: ${error.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function gerarAudioElevenLabs(texto, nomeArquivo, voiceId, apiKey) {
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': apiKey
          },
          body: JSON.stringify({
            text: texto,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75
            }
          })
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.detail?.message || `HTTP ${response.status} - ${response.statusText}`);
        }

        const blob = await response.blob();
        
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);
        
        logMessage(`✅ Arquivo gerado e baixado: ${nomeArquivo}`);

      } catch (err) {
        logMessage(`❌ Erro ao gerar ${nomeArquivo}: ${err.message}`);
      }
    }
  </script>
</body>
</html>
